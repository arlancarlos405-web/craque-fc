<style>
*{box-sizing:border-box}
:root{--bg:#eef2f5;--fg:#10202e;--card:#fff;--mut:#5b6b79;--ac:#18a34a;--bd:#d5dde3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a24;--fg:#e8eef3;--card:#16283a;--mut:#93a4b3;--bd:#27405a}}
:root[data-theme=dark]{--bg:#0e1a24;--fg:#e8eef3;--card:#16283a;--mut:#93a4b3;--bd:#27405a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden}
#ui{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px}
h1{margin:6px 0 2px;font-size:26px}h2{margin:0 0 8px;font-size:18px}p{margin:4px 0;color:var(--mut)}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;width:100%;margin:4px 0}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}.sel{outline:2px solid var(--ac)}
.big{font-size:22px;font-weight:700}.g{color:#18a34a}.r{color:#d33}
#game{position:fixed;inset:0;display:none;background:#0b3d1a;touch-action:none;user-select:none;-webkit-user-select:none}
#hud{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;align-items:center;gap:8px;background:#0b1530e0;color:#fff;font:700 15px system-ui;padding:5px 10px;border-radius:6px;z-index:2}#hud .ck{background:#f5d90a;color:#111;padding:2px 7px;border-radius:4px}#mm{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateX(-50%);width:130px;height:82px;background:#0a5a1a99;border:1px solid #fffa;border-radius:4px}#nb{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:#0b1530e0;color:#fff;padding:5px 10px;border-radius:6px;font:700 13px system-ui}
canvas{display:block;margin:0 auto}
.bt{position:absolute;border-radius:50%;background:#fff3;border:2px solid #fff9;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
#jb{position:absolute;width:90px;height:90px;border-radius:50%;border:2px solid #fff8;display:none;margin:-45px 0 0 -45px}
#jk{position:absolute;width:40px;height:40px;border-radius:50%;background:#fffa;left:25px;top:25px}
#msg{position:absolute;left:0;right:0;top:38%;text-align:center;color:#fff;font:800 44px system-ui;text-shadow:0 3px 8px #000;pointer-events:none}#sta{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:70px;height:6px;background:#0006;border-radius:3px}#sta i{display:block;height:100%;background:#ffe400;border-radius:3px}
.lk{margin:-14px;padding:14px;min-height:100%;background:linear-gradient(160deg,#0a1530,#1a2f66);color:#fff}.lk p{color:#a9bde8}.lk button:not(.pk){background:#ffffff18;color:#fff;border-color:#ffffff30}.bl{background:linear-gradient(#1f45bd,#2859d8);border-radius:10px;padding:12px;margin:0 0 10px;flex:1}.bl p{color:#d3e0ff;margin:4px 0}.ov{display:inline-block;background:#fff;color:#123;font-weight:800;padding:1px 8px;border-radius:4px;font-size:20px}.pk{background:#ff1e56!important;color:#fff!important;border:0!important;font-weight:800;font-size:18px;padding:14px!important}

const lg=(n,h)=>LOGO[n]?`<img src="${LOGO[n]}" style="height:${h}px;vertical-align:middle">`:"";
const LN={BR:"Brasil",EN:"Inglaterra",EU:"Europa"},T={},ALL=[];
for(const k in LG)LG[k].forEach(([n,s,d])=>{const t={n,s,l:k,d:d||1};T[n]=t;ALL.push(t)});
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const fmt=v=>v>=1?"€"+v.toFixed(1)+" mi":"€"+Math.round(v*1000)+" mil";
const POS=["GOL","ZAG","MEI","ATA"],SLOT={GOL:0,ZAG:2,MEI:6,ATA:9},PM={GOL:.85,ZAG:.95,MEI:1.05,ATA:1.15};
const SR=t=>"Série "+"ABCD"[t.d-1];
const opts=f=>["BR","EN","EU"].flatMap(k=>[1,2,3,4].map(d=>[k,d])).filter(([k,d])=>ALL.some(t=>t.l==k&&t.d==d&&(!f||f(t)))).map(([k,d])=>`<optgroup label="${LN[k]} · Série ${"ABCD"[d-1]}">`+ALL.filter(t=>t.l==k&&t.d==d&&(!f||f(t))).map(t=>`<option>${t.n}</option>`).join("")+"</optgroup>").join("");
let G=null;try{G=JSON.parse(localStorage.getItem("craque"))}catch(e){}
const save=()=>{try{localStorage.setItem("craque",JSON.stringify(G))}catch(e){}};
const ui=h=>{$("#game").style.display="none";$("#ui").style.display="block";$("#ui").innerHTML=h;$("#ui").scrollTop=0};
let pick="ATA";
const posBtns=()=>`<div class="row">${POS.map(p=>`<button class="${p==pick?"sel":""}" onclick="pick='${p}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">${p}</button>`).join("")}</div>`;

function home(){if(!ALL.length)return ui(`<h1>⚽ Craque FC</h1><div class="card"><h2>Nenhum time cadastrado</h2><p>Envie a lista de times no chat para o jogo ser preenchido.</p></div>`);ui(`<h1>⚽ Craque FC</h1><p>${ALL.length} clubes: Brasil, Inglaterra e Europa.</p><div class="card"><h2>Modo História</h2><p>Comece numa promessa da base, jogue temporadas, valorize seu passe e escolha propostas de clubes.</p>${G?`<button class="p" onclick="hub()">Continuar: ${G.n} (${G.club})</button>`:""}<button class="${G?"":"p"}" onclick="newStory()">Nova carreira</button></div><div class="card"><h2>Jogo Rápido</h2><p>Escolha seu time, o adversário e sua posição.</p><select id="qa" onchange="qpv()">${opts()}</select><select id="qb" onchange="qpv()">${opts()}</select><div class="row" id="qp" style="align-items:center;justify-content:center;text-align:center;min-height:50px"></div>${posBtns()}<button class="p" onclick="quick()">Jogar</button></div>`);$("#qb").selectedIndex=3;qpv()}
function qpv(){$("#qp").innerHTML=`<div>${lg($("#qa").value,44)}</div><b>VS</b><div>${lg($("#qb").value,44)}</div>`}
function quick(){const a=T[$("#qa").value],b=T[$("#qb").value];play({a,b,pos:pick,ovr:70,done:r=>ui(`<h1>Fim de jogo</h1><div class="card"><div class="big">${a.n} ${r.gf} x ${r.ga} ${b.n}</div><p>Nota: ${r.rat.toFixed(1)} · Gols ${r.g} · Assist. ${r.a} · Desarmes ${r.t}</p><button class="p" onclick="home()">Menu</button></div>`)})}
function newStory(){ui(`<h1>Nova carreira</h1><div class="card"><input id="nm" placeholder="Nome do jogador" maxlength="18"><p>Posição</p>${posBtns()}${true?`<p>Clube inicial ${ALL.some(t=>t.d==4)?"(Série D)":"(modo teste: Série A)"}</p><select id="cl">${opts(t=>t.d==(ALL.some(x=>x.d==4)?4:1))}</select><button class="p" onclick="startStory()">Começar aos 17 anos</button>`:`<p>Aguardando os times da Série D para liberar a carreira.</p>`}<button onclick="home()">Voltar</button></div>`)}
